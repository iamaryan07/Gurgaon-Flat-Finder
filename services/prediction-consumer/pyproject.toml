[project]
name = "gurgaon-prediction-consumer"
version = "0.1.0"
description = "Async prediction event consumer for Gurgaon Property Lens"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0", "pika>=1.3.2", "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0", "sqlalchemy>=2.0.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
