worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format upstream '$remote_addr - [$time_local] "$request" $status $body_bytes_sent -> $upstream_addr';
    access_log /dev/stdout upstream;

    upstream prediction_upstream {
        server prediction-service-1:8001 max_fails=2 fail_timeout=30s;
        server prediction-service-2:8001 max_fails=2 fail_timeout=30s;
    }

    server {
        listen 8001;
        listen [::]:8001;

        proxy_connect_timeout 2s;

        location / {
            proxy_pass http://prediction_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
