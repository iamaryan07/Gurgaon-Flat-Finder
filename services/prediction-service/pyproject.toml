[project]
name = "gurgaon-prediction-service"
version = "0.1.0"
description = "Prediction service for Gurgaon Property Lens"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0", "huggingface_hub>=0.25.0", "joblib>=1.4.0",
  "numpy>=1.26.0", "pandas>=2.2.0", "pika>=1.3.2", "pydantic-settings>=2.6.0",
  "scikit-learn==1.7.1", "uvicorn[standard]>=0.32.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
