[project]
name = "gurgaon-api-gateway"
version = "0.1.0"
description = "API gateway for Gurgaon Property Lens"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0", "httpx>=0.27.0",
  "pydantic-settings>=2.6.0", "uvicorn[standard]>=0.32.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
