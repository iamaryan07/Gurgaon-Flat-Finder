[project]
name = "gurgaon-prediction-api"
version = "0.1.0"
description = "Prediction service for Gurgaon Property Lens"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0", "fastapi>=0.115.0", "geopy>=2.4.0", "huggingface_hub>=0.25.0", "joblib>=1.4.0", "pandas>=2.2.0", "pyarrow>=18.0.0",
  "psycopg[binary]>=3.2.0", "pydantic-settings>=2.6.0", "scikit-learn==1.7.1",
  "sqlalchemy>=2.0.0", "uvicorn[standard]>=0.32.0"
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
