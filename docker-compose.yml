x-prediction-service: &prediction-service
  build: ./services/prediction-service
  env_file:
    - services/prediction-service/.env
  environment:
    MODEL_REPO_ID: ${MODEL_REPO_ID:-iamAryan/gurgaon-property-price-model}
    MODEL_FILENAME: ${MODEL_FILENAME:-property_price_model.pkl}
    WEB_ORIGIN: http://localhost:3000
  networks:
    - gurgaon
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 180s

services:
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - gurgaon
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      PREDICTION_SERVICE_URL: http://prediction-load-balancer:8001
      MARKET_SERVICE_URL: http://market-service:8002
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8003
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      prediction-load-balancer:
        condition: service_healthy
      market-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
    networks:
      - gurgaon
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prediction-load-balancer:
    image: nginx:alpine
    volumes:
      - ./services/prediction-load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      prediction-service-1:
        condition: service_healthy
      prediction-service-2:
        condition: service_healthy
    networks:
      - gurgaon
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prediction-service-1:
    <<: *prediction-service
    container_name: prediction-service-1

  prediction-service-2:
    <<: *prediction-service
    container_name: prediction-service-2

  market-service:
    build: ./services/market-service
    env_file:
      - services/market-service/.env
    environment:
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-600}
      WEB_ORIGIN: http://localhost:3000
    networks:
      - gurgaon
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  recommendation-service:
    build: ./services/recommendation-service
    env_file:
      - services/recommendation-service/.env
    environment:
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-600}
      WEB_ORIGIN: http://localhost:3000
    networks:
      - gurgaon
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prediction-consumer:
    build: ./services/prediction-consumer
    command: python -m app.consumer
    env_file:
      - services/prediction-consumer/.env
    networks:
      - gurgaon

networks:
  gurgaon:
    driver: bridge
